<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        };
    </script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/275b5d5243.js" crossorigin="anonymous"></script>

    <title>Faz Ou Bebe - Offline</title>
</head>

<style>
    /* O mesmo CSS que você usava antes */
    html {
        border-radius: 100px;
        scrollbar-width: none;
        scrollbar-color: #008fd1 white;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
    }

    /* Animações para virada de carta */
    @keyframes virarCarta {
        0% {
            transform: rotateY(0deg);
        }

        25% {
            transform: rotateY(-90deg);
        }

        50% {
            transform: rotateY(-180deg);
        }

        75% {
            transform: rotateY(-270deg);
        }

        100% {
            transform: rotateY(-360deg);
        }
    }

    .flip {
        animation: virarCarta 1s ease-in-out forwards;
    }

    .carta-container {
        perspective: 1000px;
        display: inline-block;
    }

    .carta-inner {
        width: 210px;
        height: 300px;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 1s;
    }

    .carta-front,
    .carta-back {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
    }

    .carta-back {
        transform: rotateY(180deg);
    }
</style>

<body class="bg-zinc-800 text-white">
    <button id="botaoNovoJogo" class="absolute top-2 left-6 px-5 py-2 bg-blue-600 rounded">Novo Jogo</button>
    <div class="pt-8 mt-8 container justify-center m-auto w-max-screen px-5">
        <div class="container flex gap-4 justify-center min-w-[500px]">
            <div id="carta" class="carta-container">
                <div class="carta-inner">
                    <div class="carta-front">
                        <img src="img/capa.png" class="w-[210px] rounded">
                    </div>
                    <div class="carta-back">
                        <img src="img/capa.png" class="w-[210px] rounded">
                    </div>
                </div>
            </div>

            <div id="monte">
                <img src="img/baralho.png" alt="Monte de cartas" class="w-[300px]">
            </div>
        </div>

        <div id="historico" class="justify-left mt-5 pt-9">
            <h3>Histórico de Cartas Sorteadas:</h3>
            <ul id="historicoLista" class="flex flex-wrap gap-1"></ul>
        </div>
    </div>

    <script>
        let availableCards = [];
        const monte = document.getElementById('monte');
        const cartaElement = document.getElementById('carta');
        const historicoLista = document.getElementById('historicoLista');
        const botaoNovoJogo = document.getElementById('botaoNovoJogo');

        // Função para obter a lista de cartas do servidor
        function fetchCards() {
            fetch('/api/cards')
                .then(response => response.json())
                .then(cards => {
                    availableCards = cards.map(card => 'cards/' + card); // Caminho das cartas
                })
                .catch(error => {
                    console.error('Erro ao carregar cartas:', error);
                });
        }

        // Função para sortear uma carta aleatória
        function getRandomCard() {
            if (availableCards.length === 0) {
                cartaElement.innerHTML = "<p>Não há mais cartas disponíveis!</p>";
                return;
            }

            const randomIndex = Math.floor(Math.random() * availableCards.length);
            const cardPath = availableCards[randomIndex];

            // Remove a carta sorteada da lista
            availableCards.splice(randomIndex, 1);

            // Aplica a animação de virada na carta
            const cartaInner = cartaElement.querySelector('.carta-inner');
            cartaInner.classList.add('flip');
            setTimeout(() => {
                cartaElement.querySelector('.carta-front').innerHTML = `<img src="${cardPath}" class="w-[210px] rounded">`;
            }, 500);

            // Adiciona a carta ao histórico
            setTimeout(() => {
                const li = document.createElement('li');
                li.innerHTML = `<img src="${cardPath}" class="rounded" alt="Carta" style="max-width: 150px; margin-right: 10px;">`;
                historicoLista.prepend(li);
                cartaInner.classList.remove('flip');
            }, 1000);
        }

        // Novo jogo
        function resetGame() {
            fetchCards(); // Recarrega as cartas
            cartaElement.innerHTML = '<img src="img/capa.png" class="flip w-[210px] rounded">';
            historicoLista.innerHTML = '';
        }

        // Quando clicar no monte (imagem)
        monte.addEventListener('click', () => {
            getRandomCard(); // Sorteia uma carta
        });

        // Quando clicar no botão "Novo Jogo"
        botaoNovoJogo.addEventListener('click', () => {
            resetGame(); // Reinicia o jogo
        });

        // Carregar as cartas ao iniciar
        window.onload = fetchCards;
    </script>
</body>

</html>
