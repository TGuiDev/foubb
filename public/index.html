<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script
        src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp,container-queries"></script>

    <script>
        // Configuração inicial do Tailwind CSS
        tailwind.config = {
            darkMode: 'class',
        };
    </script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/275b5d5243.js" crossorigin="anonymous"></script>

    <title>Faz Ou Bebe</title>
</head>
<style>
    /* CSS para navegadores baseados em WebKit */
    html {
        border-radius: 100px;
        scrollbar-width: none;
        scrollbar-color: #008fd1 white;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
    }


    /* Para WebKit */
    ::-webkit-scrollbar {
        border-radius: 100px;
        width: 12px;
    }

    ::-webkit-scrollbar-track {
        background: #008fd1;
    }

    ::-webkit-scrollbar-thumb {
        background-color: #f1f1f1;
        border-radius: 100px;
        border: 3px solid #f1f1f1;
    }

    ::-webkit-scrollbar {
        border-radius: 100px;
        width: 12px;
    }

    ::-webkit-scrollbar-track {
        background: #008fd1;
    }

    ::-webkit-scrollbar-thumb {
        background-color: #f1f1f1;
        border-radius: 100px;
        border: 3px solid #f1f1f1;
    }

    /* CSS para animação de virada de carta */
    @keyframes virarCarta {
        0% {
            transform: rotateY(0deg);
        }

        25% {
            transform: rotateY(-90deg);
        }

        50% {
            transform: rotateY(-180deg);
            /* No meio da animação, vamos trocar a carta */
        }

        75% {
            transform: rotateY(-270deg);
        }

        100% {
            transform: rotateY(-360deg);
        }
    }

    .flip {
        animation: virarCarta 1s ease-in-out forwards;
        /* Define a animação para virar a carta */
    }

    /* Definir estilo para o contêiner da carta */
    .carta-container {
        perspective: 1000px;
        /* Cria uma perspectiva 3D para a animação */
        display: inline-block;
    }

    .carta-inner {
        width: 210px;
        height: 300px;
        position: relative;
        transform-style: preserve-3d;
        /* Permite a rotação 3D */
        transition: transform 1s;
        /* Suaviza a transição */
    }

    .carta-front,
    .carta-back {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        /* Esconde o verso da carta enquanto vira */
    }

    .carta-back {
        transform: rotateY(180deg);
        /* Gira a capa para que ela fique visível ao virar */
    }
</style>

<body class="bg-zinc-800 text-white">
    <button id="botaoNovoJogo" class="absolute top-2 left-6 px-5 py-2 bg-blue-600 rounded">Novo Jogo</button>
    <div class="pt-8 mt-8 container justify-center m-auto w-max-screen px-5">
        <div class="container flex gap-4 justify-center min-w-[500px]">
            <div id="carta" class="carta-container">
                <div class="carta-inner">
                    <!-- A carta da frente (imagem sorteada) -->
                    <div class="carta-front">
                        <img src="img/capa.png" class="w-[210px] rounded">
                    </div>
                    <!-- A capa da carta (imagem fixa que ficará visível durante a rotação) -->
                    <div class="carta-back">
                        <img src="img/capa.png" class="w-[210px] rounded">
                    </div>
                </div>
            </div>


            <div id="monte">
                <img src="img/baralho.png" alt="Monte de cartas" class="w-[300px]">
            </div>
        </div>

        <div id="historico" class="justify-left mt-5 pt-9">
            <h3>Histórico de Cartas Sorteadas:</h3>
            <ul id="historicoLista" class="flex flex-wrap gap-1"></ul>
        </div>

    </div>
    <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
    <script>
        const socket = io();
        const monte = document.getElementById('monte');
        const cartaElement = document.getElementById('carta');
        const historicoLista = document.getElementById('historicoLista');
        const botaoNovoJogo = document.getElementById('botaoNovoJogo');

        // Quando uma nova carta for sorteada
        socket.on('newCard', (cardPath) => {
            // Aplica a animação de virada na carta
            const cartaInner = cartaElement.querySelector('.carta-inner');
            cartaInner.classList.add('flip'); // Adiciona a classe para virar a carta

            // Alterar a carta no meio da animação
            setTimeout(() => {
                // Altera a carta exibida para a nova carta sorteada
                cartaElement.querySelector('.carta-front').innerHTML = `<img src="${cardPath}" class="w-[210px] rounded">`;
            }, 500); // 500ms é no meio da animação, 1s / 2

            // Após a animação de virada, adiciona a nova carta ao histórico
            setTimeout(() => {
                // Adiciona a carta ao início do histórico
                const li = document.createElement('li');
                li.innerHTML = `<img src="${cardPath}" class="rounded" alt="Carta" style="max-width: 150px; margin-right: 10px;">`;

                // Adiciona o novo item ao início da lista
                historicoLista.prepend(li);

                // Reseta a animação, removendo a classe 'flip' para permitir a próxima rotação
                cartaInner.classList.remove('flip');
            }, 1000); // O tempo da animação (1000ms)
        });


        // Quando todas as cartas forem sorteadas
        socket.on('noMoreCards', (message) => {
            cartaElement.innerHTML = `<p>${message}</p>`;
        });

        // Quando clicar no monte (imagem)
        monte.addEventListener('click', () => {
            socket.emit('clickMonte'); // Solicita uma carta do servidor
        });

        // Quando clicar no botão "Novo Jogo"
        botaoNovoJogo.addEventListener('click', () => {
            socket.emit('resetGame');
            cartaElement.innerHTML = '<img src="img/capa.png" class="flip w-[210px] rounded">'; // Limpa a carta exibida
            historicoLista.innerHTML = '';
        });
    </script>
</body>
</html>
